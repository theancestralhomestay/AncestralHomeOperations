name: Deploy Web Portal to GitHub Pages

on:
  push:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      # ── Checkout both branches ──────────────────────────────
      - name: Checkout main (Production source)
        uses: actions/checkout@v4
        with:
          ref: main
          path: _source_prod

      - name: Checkout develop (UAT source)
        uses: actions/checkout@v4
        with:
          ref: develop
          path: _source_uat
        continue-on-error: true  # Graceful fallback if develop doesn't exist yet

      # ── Assemble composite site ─────────────────────────────
      - name: Build composite deployment
        run: |
          mkdir -p _site/uat

          echo "📦 Copying Production files from main → _site/"
          cp _source_prod/index.html _site/
          [ -f _source_prod/KNOWLEDGE_BASE.md ] && cp _source_prod/KNOWLEDGE_BASE.md _site/ || true
          [ -f _source_prod/README.md ] && cp _source_prod/README.md _site/ || true

          if [ -d _source_uat ]; then
            echo "📦 Copying UAT files from develop → _site/uat/"
            cp _source_uat/index.html _site/uat/
            [ -f _source_uat/KNOWLEDGE_BASE.md ] && cp _source_uat/KNOWLEDGE_BASE.md _site/uat/ || true
            [ -f _source_uat/README.md ] && cp _source_uat/README.md _site/uat/ || true
          else
            echo "⚠️ develop branch not found — UAT subdirectory will be empty"
          fi

          # Prevent Jekyll processing
          touch _site/.nojekyll

          echo "✅ Composite site assembled:"
          find _site -type f | sort

      # ── Deploy ──────────────────────────────────────────────
      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
